name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Proyek tanpa dependensi → tidak perlu npm install.
      - name: Syntax check (node --check semua file JS)
        run: npm run check

      - name: Test suite (node --test)
        run: npm test
